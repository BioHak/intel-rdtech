<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R&D Technology Intelligence</title>
<style>
:root{--bg:#0b1118;--panel:#121b25;--line:#263545;--text:#e8eef4;--muted:#91a2b3;--accent:#6db7d8;--hot:#e6b566;--green:#75c9a6;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1240px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font-size:clamp(28px,4vw,48px);margin:5px 0 3px;letter-spacing:-.03em}.sub,.muted{color:var(--muted)}.stats{display:flex;gap:22px;flex-wrap:wrap}.stat b{font-size:25px;display:block}.stat span{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.tools button,.tools select,.tools input{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:7px}.tools button{cursor:pointer}.tools button.active{border-color:var(--accent);color:var(--accent)}.tools input{min-width:260px;flex:1}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:24px}.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:17px;margin-bottom:10px}.card h2{font-size:18px;line-height:1.25;margin:8px 0}.card h2 a{color:var(--text);text-decoration:none}.card h2 a:hover{color:var(--accent)}.meta,.tags{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:99px;padding:3px 7px}.preprint{color:var(--hot)}.peer_reviewed{color:var(--green)}.summary{font-size:14px;line-height:1.48;color:#c5d0da;margin:9px 0 0}.side .card h2{font-size:15px}.empty{padding:50px;text-align:center;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;color:var(--muted);font-size:12px}@media(max-width:800px){.head{display:block}.stats{margin-top:18px}.grid{grid-template-columns:1fr}.tools input{min-width:100%}}
</style>
</head>
<body><main>
<header class="head"><div><div class="eyebrow">R&D Technology Advisory</div><h1>Intelligence Console</h1><div class="sub">Emerging science · scientific informatics · AI/ML · pharma R&D</div></div><div class="stats"><div class="stat"><b id="total">—</b><span>Signals</span></div><div class="stat"><b id="preprints">—</b><span>Preprints</span></div><div class="stat"><b id="sources">—</b><span>Sources</span></div></div></header>
<div class="tools"><button class="active" data-topic="all">All</button><button data-topic="scientific_informatics">Informatics</button><button data-topic="ai_drug_discovery">AI / Drug Discovery</button><button data-topic="ai_reliability">AI Reliability</button><button data-topic="lab_automation">Automation</button><input id="search" placeholder="Search titles, abstracts, sources…"></div>
<div class="grid"><section><h3 class="section-title">Latest intelligence</h3><div id="latest"></div></section><aside class="side"><h3 class="section-title">Emerging science</h3><div id="emerging"></div></aside></div>
<footer><span id="updated"></span> · v0.1 · Experimental intelligence feed. Topic labels are automated and under active evaluation.</footer>
</main>
<script>
const DATA='../data/feeds/feed.json'; let all=[],topic='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>{const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||''};
const fmt=d=>d?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(new Date(d)):'';
function card(r,small=false){const sum=clean(r.summary);return `<article class="card"><div class="meta"><span>${esc(r.source)}</span><span>·</span><span>${fmt(r.published)}</span>${r.evidence_stage?`<span class="tag ${esc(r.evidence_stage)}">${esc(r.evidence_stage.replace('_',' '))}</span>`:''}${r.category?`<span class="tag">${esc(r.category)}</span>`:''}</div><h2><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></h2><div class="tags">${(r.topics||[]).map(t=>`<span class="tag">${esc(t.replaceAll('_',' '))}</span>`).join('')}</div>${!small&&sum?`<p class="summary">${esc(sum.slice(0,420))}${sum.length>420?'…':''}</p>`:''}</article>`}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=all.filter(r=>(topic==='all'||(r.topics||[]).includes(topic))&&(!q||[r.title,r.summary,r.source,r.category].join(' ').toLowerCase().includes(q)));document.getElementById('latest').innerHTML=rows.slice(0,40).map(r=>card(r)).join('')||'<div class="empty">No matching signals.</div>';const emerging=rows.filter(r=>r.evidence_stage==='preprint').slice(0,12);document.getElementById('emerging').innerHTML=emerging.map(r=>card(r,true)).join('')||'<div class="empty">No matching preprints.</div>'}
async function load(){try{const d=await (await fetch(DATA)).json();all=d.records||[];document.getElementById('total').textContent=d.record_count??all.length;document.getElementById('preprints').textContent=all.filter(r=>r.evidence_stage==='preprint').length;document.getElementById('sources').textContent=d.source_count??new Set(all.map(r=>r.source_id)).size;document.getElementById('updated').textContent='Updated '+fmt(d.generated_at);render()}catch(e){document.getElementById('latest').innerHTML='<div class="empty">Feed unavailable. Serve the repository root so data/feeds/feed.json is accessible.</div>';console.error(e)}}
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});document.getElementById('search').addEventListener('input',render);load();
</script></body></html>
